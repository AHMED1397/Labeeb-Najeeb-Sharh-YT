<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5632"/>
      <stop offset="100%" stop-color="#0e3a20"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a951"/>
      <stop offset="100%" stop-color="#e0c97a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- book spine -->
  <rect x="44" y="22" width="12" height="56" rx="2" fill="url(#gold)"/>
  <!-- left page -->
  <path d="M44 24 Q30 22 20 28 L20 76 Q30 70 44 76 Z" fill="#f5f0e6" opacity="0.95"/>
  <!-- right page -->
  <path d="M56 24 Q70 22 80 28 L80 76 Q70 70 56 76 Z" fill="#f5f0e6" opacity="0.95"/>
  <!-- arabic calligraphy line on left page -->
  <line x1="28" y1="42" x2="40" y2="40" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="48" x2="38" y2="46" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="54" x2="36" y2="52" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- arabic calligraphy line on right page -->
  <line x1="60" y1="42" x2="72" y2="40" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="48" x2="72" y2="46" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="54" x2="70" y2="52" stroke="#1a5632" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- gold star/decoration -->
  <circle cx="50" cy="85" r="4" fill="url(#gold)" opacity="0.8"/>
</svg>
